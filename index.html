
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b16;color:#00eaff;
 font-family:Arial;text-align:center;padding:20px;
}
h1{font-size:36px;letter-spacing:5px}
.circle{
 width:160px;height:160px;border:3px solid #00eaff;
 border-radius:50%;margin:25px auto;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 25px #00eaff,inset 0 0 20px #00eaff;
 font-size:55px;animation:pulse 2s infinite;
}
@keyframes pulse{
 50%{box-shadow:0 0 45px #00eaff}
}
input{
 width:100%;padding:16px;border-radius:12px;
 border:1px solid #00eaff;background:#101d30;
 color:white;font-size:16px;margin:12px 0;
}
button{
 padding:13px 20px;margin:6px;border:0;
 border-radius:10px;background:#00eaff;
 color:#00111b;font-size:16px;font-weight:bold;
}
#answer{
 margin-top:20px;padding:18px;background:#101d30;
 border:1px solid #00eaff;border-radius:12px;
 color:white;min-height:75px;text-align:left;
 line-height:1.6;white-space:pre-wrap;
}
.small{color:#9ab8c8;font-size:13px}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>YOUR PERSONAL SMART ASSISTANT</p>

<div class="circle">🤖</div>

<p id="status">SYSTEM ONLINE</p>

<input id="question" placeholder="Ask me anything...">

<button onclick="ask()">ASK JARVIS</button>
<button onclick="listen()">🎙️ SPEAK</button>
<button onclick="stopVoice()">🔇 STOP</button>

<div id="answer">Hello! I am JARVIS. Ask me a question.</div>

<p class="small">Maths | English | Science | General Knowledge</p>
<p class="small">Free browser-based assistant</p>

<script>
const question=document.getElementById("question");
const answer=document.getElementById("answer");
const status=document.getElementById("status");

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();

 let msg=new SpeechSynthesisUtterance(text);
 msg.lang="en-IN";
 msg.rate=0.9;
 msg.pitch=0.75;

 let voices=speechSynthesis.getVoices();
 let male=voices.find(v=>
   /male|david|mark|daniel|ravi/i.test(v.name)
 );
 let indian=voices.find(v=>/en-IN/i.test(v.lang));
 msg.voice=male || indian || voices[0];

 speechSynthesis.speak(msg);
}

function calculate(q){
 let s=q.toLowerCase()
 .replace(/what is|calculate|solve|how much is|answer|equals|equal to/g,"")
 .replace(/plus/g,"+")
 .replace(/minus/g,"-")
 .replace(/multiplied by|times/g,"*")
 .replace(/divided by/g,"/")
 .replace(/x/g,"*")
 .replace(/[^0-9+\-*/%.() ]/g,"")
 .trim();

 if(!s || !/[0-9]/.test(s)) return null;

 try{
  let tokens=s.match(/\d+(?:\.\d+)?|[()+\-*/%]/g);
  if(!tokens || tokens.join("")!==s.replace(/\s/g,"")) return null;

  let i=0;
  function factor(){
   let t=tokens[i++];
   if(t==="("){
    let v=expression();
    if(tokens[i++]!==")") throw Error();
    return v;
   }
   if(t==="-") return -factor();
   if(t==="+") return factor();
   let n=Number(t);
   if(!Number.isFinite(n)) throw Error();
   return n;
  }
  function term(){
   let v=factor();
   while(tokens[i]==="*"||tokens[i]==="/"||tokens[i]==="%"){
    let op=tokens[i++];
    let n=factor();
    if((op==="/"||op==="%")&&n===0) throw Error();
    if(op==="*") v*=n;
    if(op==="/") v/=n;
    if(op==="%") v%=n;
   }
   return v;
  }
  function expression(){
   let v=term();
   while(tokens[i]==="+"||tokens[i]==="-"){
    let op=tokens[i++];
    let n=term();
    v=op==="+"?v+n:v-n;
   }
   return v;
  }

  let result=expression();
  if(i!==tokens.length||!Number.isFinite(result)) return null;
  return "The answer is "+Number(result.toFixed(8));
 }catch(e){
  return null;
 }
}

const knowledge=[
 [/^(hi|hello|hey)\b/,"Hello! I am JARVIS. How can I help you?"],
 [/your name|who are you/,"I am JARVIS, your personal browser assistant."],
 [/how are you/,"I am functioning perfectly. Ready to help you!"],
 [/thank you|thanks/,"You are welcome! Happy to help."],
 [/capital of india/,"The capital of India is New Delhi."],
 [/capital of france/,"The capital of France is Paris."],
 [/largest planet/,"Jupiter is the largest planet in our solar system."],
 [/red planet/,"Mars is known as the Red Planet."],
 [/boiling point of water/,"Water boils at 100 degrees Celsius at standard atmospheric pressure."],
 [/freezing point of water/,"Water freezes at 0 degrees Celsius at standard atmospheric pressure."],
 [/photosynthesis/,"Photosynthesis is the process by which green plants use sunlight, water and carbon dioxide to make food and release oxygen."],
 [/human heart/,"The human heart pumps blood throughout the body."],
 [/human body.*bones|how many bones/,"An adult human skeleton usually has 206 bones."],
 [/h2o|chemical formula of water/,"The chemical formula of water is H2O."],
 [/newton.*first law|first law of motion/,"Newton's first law says that an object stays at rest or in uniform motion unless acted upon by an external force."],
 [/noun/,"A noun is the name of a person, place, animal or thing. Examples: teacher, Delhi, dog and book."],
 [/verb/,"A verb is a word that shows an action or state. Examples: run, eat, write and is."],
 [/adjective/,"An adjective describes a noun. Examples: beautiful, tall, clever and happy."],
 [/pronoun/,"A pronoun is a word used instead of a noun. Examples: he, she, it and they."],
 [/opposite of happy/,"The opposite of happy is sad."],
 [/synonym of happy/,"Some synonyms of happy are joyful, cheerful and glad."],
 [/full form of cpu/,"CPU stands for Central Processing Unit."],
 [/full form of computer/,"Computer is not an abbreviation. It is an electronic device that processes information."],
 [/who is the prime minister of india/,"Narendra Modi is the Prime Minister of India as of November 2026."],
 [/solar system/,"Our solar system has eight planets orbiting the Sun."],
 [/earth.*sun|sun.*earth/,"The Earth revolves around the Sun and takes approximately 365 days to complete one revolution."]
];

function getAnswer(q){
 let math=calculate(q);
 if(math!==null) return math;

 for(let item of knowledge){
  if(item[0].test(q)) return item[1];
 }

 return "I don't have that answer in my offline knowledge yet. Please try asking a basic Maths, English, Science or General Knowledge question.";
}

function ask(){
 let q=question.value.trim();
 if(!q){
  answer.textContent="Please type a question first.";
  return;
 }
 let result=getAnswer(q);
 answer.textContent="JARVIS: "+result;
 speak(result);
}

question.addEventListener("keydown",e=>{
 if(e.key==="Enter") ask();
});

function listen(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  answer.textContent="Voice recognition is not supported. Please use Chrome or type your question.";
  return;
 }
 let rec=new SR();
 rec.lang="en-IN";
 rec.onstart=()=>status.textContent="LISTENING...";
 rec.onend=()=>status.textContent="SYSTEM ONLINE";
 rec.onerror=()=>status.textContent="MICROPHONE ERROR";
 rec.onresult=e=>{
  question.value=e.results[0][0].transcript;
  ask();
 };
 rec.start();
}

function stopVoice(){
 speechSynthesis.cancel();
 status.textContent="VOICE STOPPED";
}

if("speechSynthesis" in window){
 speechSynthesis.onvoiceschanged=()=>{};
}
</script>
</body>
</html>
